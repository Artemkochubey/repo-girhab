# Для сервера в интернете: сайт доступен только через Caddy (HTTPS + пароль).
# Порт 3000 наружу не публикуется. Запускать ТОЛЬКО на сервере через ./deploy/setup.sh (см. DEPLOY.md).
# На домашнем компьютере используйте обычный docker-compose.yml.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - COOKIE_SECURE=1
    volumes:
      - ./data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy:/etc/caddy:ro   # папкой, чтобы Docker не создавал каталог вместо отсутствующего Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
