# Для сервера в интернете: сайт доступен только через Caddy (HTTPS + пароль).
# Порт 3000 наружу не публикуется. Запуск: см. DEPLOY.md
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - COOKIE_SECURE=1
    volumes:
      - ./data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
